// REPLAY (时光机) -- chronological animated playback
// ============================================================
let RP = null;

function rpDur(f){
  const base = 450 + (f.km || 500) / 6;
  return Math.max(550, Math.min(3200, base)) / (RP ? RP.speed : 1);
}
function rpPathFor(f){
  const d = A[f.depI], a = A[f.arrI];
  let pts, stopIdx = -1;
  if(f.stopI && A[f.stopI]){
    const s = A[f.stopI];
    const leg1 = gcPath(d.lat, d.lng, s.lat, s.lng);
    stopIdx = leg1.length - 1;
    pts = leg1.concat(gcPath(s.lat, s.lng, a.lat, a.lng));
  } else {
    pts = gcPath(d.lat, d.lng, a.lat, a.lng);
  }
  // Normalise longitudes near the current map centre so the drawing is visible
  const c = map.getCenter().lng;
  const mid = pts[Math.floor(pts.length/2)][1];
  let shift = 0;
  while(mid + shift > c + 180) shift -= 360;
  while(mid + shift < c - 180) shift += 360;
  if(shift) pts = pts.map(p => [p[0], p[1] + shift]);
  pts._stopIdx = stopIdx;
  return pts;
}
function openReplay(){
  const flights = visibleFlights()
    .filter(f => f.date && A[f.depI] && A[f.arrI])
    .sort((a,b) => ((a.date||'')+(a.depT||'')).localeCompare((b.date||'')+(b.depT||'')));
  if(!flights.length) return toast('当前筛选下没有可回放的航班','err');
  if(RP) closeReplay(true);
  RP = {
    flights, idx:0, t:0, playing:true, speed:2, lastTs:null, raf:null, done:false,
    trail: L.layerGroup().addTo(map),
    live: null, head: null, pts: null,
    kms:0, apSeen:new Set(), ctrySeen:new Set(),
  };
  map.removeLayer(routeLayer); map.removeLayer(airportLayer);
  $('replayBar').classList.add('on');document.body.classList.add('replaying');
  renderReplayBar();
  map.setView([32, 100], Math.max(map.getZoom(), 3), {animate:true});
  setTimeout(() => { if(RP){ rpBeginFlight(); RP.raf = requestAnimationFrame(rpFrame); } }, 500);
}
function renderReplayBar(){
  $('replayBar').innerHTML = `
    <div class="rp-row">
      <button class="rp-btn" aria-label="播放或暂停回放" id="rpPlay" onclick="rpTogglePlay()">${RP && RP.playing ? '❚❚' : '▶'}</button>
      <button class="rp-btn small" aria-label="切换回放速度" id="rpSpeed" onclick="rpCycleSpeed()">${RP ? RP.speed : 2}×</button>
      <div class="rp-date" id="rpDate">—</div>
      <div class="rp-flight" id="rpFlight"></div>
      <button class="rp-btn small rp-close" aria-label="关闭回放" onclick="closeReplay()">✕</button>
    </div>
    <div class="rp-track" id="rpTrack" onclick="rpSeekClick(event)">
      <div class="rp-track-line"></div>
      <div class="rp-track-fill" id="rpFill" style="width:0%"></div>
    </div>
    <div class="rp-stats" id="rpStats"></div>`;
}
function rpBeginFlight(){
  const f = RP.flights[RP.idx];
  RP.pts = rpPathFor(f);
  const col = yearCol(yearOf(f) || minYear);
  RP.live = L.polyline([RP.pts[0]], {color:col, weight:2.6, opacity:0.95}).addTo(RP.trail);
  RP.head = L.circleMarker(RP.pts[0], {radius:4, color:'#fff', weight:1.5, fillColor:col, fillOpacity:1}).addTo(RP.trail);
  rpDropAirport(f.depI, RP.pts[0], col);
  // Gentle camera follow: pan if the route mid-point drifted out of view
  const mid = RP.pts[Math.floor(RP.pts.length/2)];
  if(!map.getBounds().pad(-0.18).contains(mid)) map.panTo(mid, {animate:true, duration:0.6});
}
function rpDropAirport(icao, latlng, col){
  if(RP.apSeen.has(icao)) return;
  RP.apSeen.add(icao);
  const a = A[icao];
  if(a && a.ctry) RP.ctrySeen.add(a.ctry);
  L.circleMarker(latlng, {radius:3.2, color:'rgba(240,244,255,0.85)', weight:1, fillColor:col, fillOpacity:0.9})
    .bindTooltip((a ? a.nameCn.replace(/(国际)?机场$/,'') : icao), {direction:'top', className:'rp-tip', opacity:0.9})
    .addTo(RP.trail);
}
function rpFinishFlight(f){
  RP.live.setLatLngs(RP.pts);
  RP.live.setStyle({weight:1.6, opacity:0.42});
  const col = yearCol(yearOf(f) || minYear);
  rpDropAirport(f.arrI, RP.pts[RP.pts.length-1], col);
  if(f.stopI && A[f.stopI] && RP.pts._stopIdx > 0) rpDropAirport(f.stopI, RP.pts[RP.pts._stopIdx], col);
  if(RP.head){ RP.trail.removeLayer(RP.head); RP.head = null; }
  RP.kms += f.km || 0;
}
function rpFrame(ts){
  if(!RP || !RP.playing) return;
  if(RP.lastTs == null) RP.lastTs = ts;
  const dt = Math.min(80, ts - RP.lastTs);
  RP.lastTs = ts;
  const f = RP.flights[RP.idx];
  RP.t += dt / rpDur(f);
  if(RP.t >= 1){
    rpFinishFlight(f);
    RP.idx++; RP.t = 0;
    if(RP.idx >= RP.flights.length){ rpComplete(); return; }
    rpBeginFlight();
  } else {
    const n = Math.max(2, Math.ceil(RP.t * RP.pts.length));
    const partial = RP.pts.slice(0, n);
    RP.live.setLatLngs(partial);
    if(RP.head) RP.head.setLatLng(partial[partial.length-1]);
  }
  rpHud();
  RP.raf = requestAnimationFrame(rpFrame);
}
function rpHud(){
  const f = RP.flights[Math.min(RP.idx, RP.flights.length-1)];
  $('rpDate').textContent = f.date || '—';
  $('rpFlight').innerHTML = `<b>${f.no||''}</b> ${f.dep} → ${f.arr}${f.ac ? ' · ' + f.ac : ''}`;
  $('rpFill').style.width = ((RP.idx + RP.t) / RP.flights.length * 100).toFixed(2) + '%';
  $('rpStats').innerHTML =
    `<span>第 <b>${Math.min(RP.idx+1, RP.flights.length)}</b> / ${RP.flights.length} 班</span>` +
    `<span><b>${fmt(Math.round(RP.kms))}</b> km</span>` +
    `<span><b>${RP.apSeen.size}</b> 机场</span>` +
    `<span><b>${RP.ctrySeen.size}</b> 国家/地区</span>`;
}
function rpTogglePlay(){
  if(!RP) return;
  if(RP.done){ rpSeek(0); RP.done = false; }
  RP.playing = !RP.playing;
  $('rpPlay').textContent = RP.playing ? '❚❚' : '▶';
  if(RP.playing){ RP.lastTs = null; RP.raf = requestAnimationFrame(rpFrame); }
  else if(RP.raf) cancelAnimationFrame(RP.raf);
}
function rpCycleSpeed(){
  if(!RP) return;
  const seq = [1,2,4,8];
  RP.speed = seq[(seq.indexOf(RP.speed)+1) % seq.length];
  $('rpSpeed').textContent = RP.speed + '×';
}
function rpSeekClick(ev){
  if(!RP) return;
  const r = $('rpTrack').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  rpSeek(Math.floor(pct * RP.flights.length));
}
function rpSeek(idx){
  if(!RP) return;
  if(RP.raf) cancelAnimationFrame(RP.raf);
  RP.trail.clearLayers();
  RP.live = RP.head = null;
  RP.kms = 0; RP.apSeen = new Set(); RP.ctrySeen = new Set();
  RP.idx = Math.max(0, Math.min(idx, RP.flights.length-1)); RP.t = 0; RP.lastTs = null; RP.done = false;
  // Instantly rebuild everything before idx
  for(let i = 0; i < RP.idx; i++){
    const f = RP.flights[i];
    const pts = rpPathFor(f);
    const col = yearCol(yearOf(f) || minYear);
    L.polyline(pts, {color:col, weight:1.6, opacity:0.42}).addTo(RP.trail);
    rpDropAirport(f.depI, pts[0], col);
    rpDropAirport(f.arrI, pts[pts.length-1], col);
    RP.kms += f.km || 0;
  }
  rpBeginFlight();
  rpHud();
  if(RP.playing) RP.raf = requestAnimationFrame(rpFrame);
}
function rpComplete(){
  RP.playing = false; RP.done = true;
  $('rpPlay').textContent = '↻';
  $('rpDate').textContent = '旅程完成';
  $('rpFlight').innerHTML = `🎉 <b>${RP.flights.length}</b> 班 · <b>${fmt(Math.round(RP.kms))}</b> km · ${RP.apSeen.size} 座机场 · ${RP.ctrySeen.size} 个国家/地区`;
  $('rpFill').style.width = '100%';
}
function closeReplay(silent){
  if(!RP) return;
  if(RP.raf) cancelAnimationFrame(RP.raf);
  map.removeLayer(RP.trail);
  RP = null;
  $('replayBar').classList.remove('on');document.body.classList.remove('replaying');
  if(!map.hasLayer(airportLayer)) airportLayer.addTo(map);
  if(!map.hasLayer(routeLayer)) routeLayer.addTo(map);
  if(!silent) toast('已退出时光机');
}
window.openReplay = openReplay; window.closeReplay = closeReplay;
window.rpTogglePlay = rpTogglePlay; window.rpCycleSpeed = rpCycleSpeed; window.rpSeekClick = rpSeekClick;

// The same compact layout covers phones and iPad portrait / Split View.
const _sideEl=document.querySelector('.side');
const compactAtlasQuery=window.matchMedia('(max-width:767px), (min-width:768px) and (max-width:1023px) and (orientation:portrait)');
function isCompactAtlas(){return compactAtlasQuery.matches&&!window.matchMedia('(max-height:520px) and (max-width:950px) and (orientation:landscape)').matches;}
let sheetMode='half',sheetPointer=null,sheetIgnoreClick=false;
function setSheet(mode,refit=true){
 sheetMode=mode;_sideEl.classList.toggle('collapsed',mode==='collapsed');_sideEl.classList.toggle('expanded',mode==='expanded');_sideEl.style.removeProperty('--sheet-height');
 $('sideHandle').setAttribute('aria-expanded',String(mode!=='collapsed'));$('sheetExpand').setAttribute('aria-expanded',String(mode==='expanded'));
 $('sheetExpand').textContent=mode==='expanded'?'半屏 ↓':'展开 ↑';$('sheetHint').textContent=mode==='collapsed'?'上滑查看记录':mode==='expanded'?'下滑回到地图':'上滑查看更多';
 if(refit&&isCompactAtlas()&&!RP){clearTimeout(setSheet.fitTimer);setSheet.fitTimer=setTimeout(()=>{if(sheetMode!=='expanded')fitAtlas();},280);}
}
function toggleSheetExpansion(){setSheet(sheetMode==='expanded'?'half':'expanded');}
const handle=$('sideHandle');
const sheetControls=handle.closest('.sheet-controls');
function sheetDragBounds(){
 const min=sheetControls.offsetHeight+_sideEl.querySelector('.tabs').offsetHeight;
 const max=Math.max(min,_sideEl.parentElement.clientHeight-(window.innerWidth>=768?20:12));
 return {min,max};
}
sheetControls.addEventListener('click',e=>{
 if(e.target.closest('button:not(.side-handle)'))return;
 if(sheetIgnoreClick){sheetIgnoreClick=false;return;}
 setSheet(sheetMode==='collapsed'?'half':'collapsed');
});
sheetControls.addEventListener('pointerdown',e=>{
 if(!isCompactAtlas()||e.button>0||!e.isPrimary||e.target.closest('button:not(.side-handle)'))return;
 sheetPointer={id:e.pointerId,y:e.clientY,height:_sideEl.getBoundingClientRect().height,mode:sheetMode,moved:false};
 sheetControls.setPointerCapture(e.pointerId);
});
sheetControls.addEventListener('pointermove',e=>{
 if(!sheetPointer||e.pointerId!==sheetPointer.id)return;
 const delta=sheetPointer.y-e.clientY;if(Math.abs(delta)<6&&!sheetPointer.moved)return;
 sheetPointer.moved=true;_sideEl.classList.add('dragging');_sideEl.classList.remove('collapsed','expanded');
 const {min,max}=sheetDragBounds();
 _sideEl.style.setProperty('--sheet-height',Math.max(min,Math.min(max,sheetPointer.height+delta))+'px');
});
function finishSheetDrag(e){
 if(!sheetPointer||e.pointerId!==sheetPointer.id)return;
 const moved=sheetPointer.moved,delta=sheetPointer.y-e.clientY,oldMode=sheetPointer.mode;
 const height=_sideEl.getBoundingClientRect().height,parent=_sideEl.parentElement.clientHeight;sheetPointer=null;_sideEl.classList.remove('dragging');
 if(!moved)return;sheetIgnoreClick=true;
 let mode=height<parent*.29?'collapsed':height>parent*.68?'expanded':'half';
 if(Math.abs(delta)>55){const modes=['collapsed','half','expanded'];mode=modes[Math.max(0,Math.min(2,modes.indexOf(oldMode)+(delta>0?1:-1)))];}
 setSheet(mode);setTimeout(()=>{sheetIgnoreClick=false;},400);
}
sheetControls.addEventListener('pointerup',finishSheetDrag);
function cancelSheetDrag(){if(!sheetPointer)return;sheetPointer=null;_sideEl.classList.remove('dragging');setSheet(sheetMode,false);}
sheetControls.addEventListener('pointercancel',cancelSheetDrag);
sheetControls.addEventListener('lostpointercapture',cancelSheetDrag);
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{if(isCompactAtlas())setSheet(t.dataset.tab==='stats'?'half':'expanded',false);}));
function closeAtlasSearch(){ $('searchWrap').classList.remove('mobile-open');$('searchPop').classList.remove('on');$('searchInput').blur(); }
window.closeAtlasSearch=closeAtlasSearch;window.setSheet=setSheet;window.toggleSheetExpansion=toggleSheetExpansion;
let atlasResizeTimer=null;
function resizeAtlas(){
 clearTimeout(atlasResizeTimer);atlasResizeTimer=setTimeout(()=>{map.invalidateSize();if(isCompactAtlas())setSheet(sheetMode,false);if(!RP&&sheetMode!=='expanded')fitAtlas();},160);
}
window.addEventListener('resize',resizeAtlas);compactAtlasQuery.addEventListener('change',()=>{setSheet('half',false);resizeAtlas();});
function syncVisualViewport(){const v=window.visualViewport;document.documentElement.style.setProperty('--visual-height',(v?v.height:window.innerHeight)+'px');document.documentElement.style.setProperty('--visual-top',(v?v.offsetTop:0)+'px');}
syncVisualViewport();window.visualViewport?.addEventListener('resize',syncVisualViewport);window.visualViewport?.addEventListener('scroll',syncVisualViewport);window.addEventListener('resize',syncVisualViewport);
setSheet(window.matchMedia('(max-width:767px) and (max-height:700px) and (orientation:portrait)').matches?'collapsed':'half',false);

// PWA service worker (仅线上环境注册,本地预览不缓存)
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}


// Journal view: uses the same filters and records as every existing view.
let logSort='newest';
function journalFlights(){return [...visibleFlights()].sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.depT||'').localeCompare(a.depT||'') || b.id-a.id);}
function flightCard(f){
 const d=A[f.depI],a=A[f.arrI];
 return `<button class="journey-card" onclick="openFlight(${f.id})" aria-label="${attrEsc(f.date+' '+f.no+' '+f.dep+' 到 '+f.arr)}">
 <div class="journey-meta"><span>${attrEsc(f.date||'日期未记录')}</span><span class="journey-no">${attrEsc(f.no)}</span></div>
 <div class="journey-route"><span class="journey-point"><b>${attrEsc(d?.iata||f.depI||'—')}</b><small>${attrEsc(f.dep)}</small></span><span class="journey-line"></span><span class="journey-point end"><b>${attrEsc(a?.iata||f.arrI||'—')}</b><small>${attrEsc(f.arr)}</small></span></div>
 <div class="journey-foot"><span>${attrEsc(opOf(f))} · ${attrEsc(f.icao||'')}</span><span>${f.km?fmt(Math.round(f.km))+' km':'距离未记录'}${f.stop?' · 经停 '+attrEsc(f.stop):''}</span></div></button>`;
}
function renderLogTab(){
 const flights=journalFlights();if(logSort==='oldest')flights.reverse();
 return `<div class="log-tools"><span>${flights.length} 次飞行</span><select aria-label="旅程排序" onchange="logSort=this.value;renderTab()"><option value="newest" ${logSort==='newest'?'selected':''}>最新在前</option><option value="oldest" ${logSort==='oldest'?'selected':''}>最早在前</option></select></div><div class="journey-list">${flights.length?flights.map(flightCard).join(''):'<div class="tab-empty">当前筛选下没有飞行记录<button class="text-btn" onclick="resetAtlasFilters()">清除筛选</button></div>'}</div>`;
}
function renderStatsTab(){
 const flights=journalFlights();
 if(!flights.length)return '<div class="tab-empty">当前筛选下没有飞行记录<br><button class="text-btn" onclick="resetAtlasFilters()">清除筛选</button></div>';
 const totalKm=flights.reduce((s,f)=>s+(f.km||0),0),totalHr=flights.reduce((s,f)=>s+(f.sec||0),0)/3600;
 const byYear={};F.forEach(f=>{const y=yearOf(f);if(y)byYear[y]=(byYear[y]||0)+1;});
 const years=Object.keys(byYear).map(Number).sort((a,b)=>a-b),peak=Math.max(...Object.values(byYear));
 return `<div class="overview-hero"><div class="eyebrow" style="font-size:8px;letter-spacing:1.8px;margin-bottom:11px">${state.yearSet.size?'SELECTED FLIGHTS':'A LIFETIME IN THE AIR'}</div>
 <div class="overview-total"><div class="value">${flights.length}<small>次飞行</small></div><div class="period">Since ${minYear}<br>Enjoy the air.</div></div>
 <div class="passport-grid"><div class="passport-cell"><b>${(totalKm/40075).toFixed(1)}</b><small>圈地球</small><p>${fmt(Math.round(totalKm))} km 的足迹</p></div><div class="passport-cell"><b>${(totalHr/24).toFixed(1)}</b><small>天在云端</small><p>${fmt(Math.round(totalHr))} 小时的飞行</p></div></div>
 </div><section class="year-overview"><div class="section-label"><span>飞过的这些年</span><button class="text-btn" onclick="setAtlasYear(null)">${state.yearSet.size?'查看全部年份 ↗':'点击年份探索'}</button></div>
 <div class="year-chart">${years.map(y=>`<button class="year-col ${state.yearSet.has(y)?'on':''}" title="${y} · ${byYear[y]} 次飞行" aria-label="筛选 ${y} 年，${byYear[y]} 次飞行" onclick="setAtlasYear(${y})"><span class="bar" style="height:${Math.max(4,byYear[y]/peak*100)}%"></span><span class="bar-n">${byYear[y]}</span></button>`).join('')}</div><div class="year-axis"><span>${minYear}</span><span>${Math.round((minYear+maxYear)/2)}</span><span>${maxYear}</span></div>
 </section><section class="recent-overview"><div class="section-label"><span>最近的旅程</span><button class="text-btn" onclick="activateTab('log')">查看全部 ${flights.length} 程 ↗</button></div>
 <div class="journey-list">${flights.slice(0,4).map(flightCard).join('')}</div>
 </section><details class="detail-toggle"><summary>更多飞行统计与里程碑</summary>${renderDetailedStats()}</details>`;
}
function activateTab(name){
 activeTab=name;document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t.dataset.tab===name);t.setAttribute('aria-selected',String(t.dataset.tab===name));});
 if(isCompactAtlas())setSheet(name==='stats'?'half':'expanded',false);renderTab();$('tabContent').scrollTop=0;
}
function setAtlasYear(y){state.yearSet.clear();if(y!=null)state.yearSet.add(y);update();}
function resetAtlasFilters(){state.yearSet.clear();state.airlines.clear();state.aircraft.clear();state.airports.clear();update();}
function fitAtlas(){
 const points=[];visibleFlights().forEach(f=>[f.depI,f.arrI,f.stopI].forEach(ic=>{if(A[ic])points.push([A[ic].lat,A[ic].lng]);}));
 if(!points.length)return toast('当前没有可显示的航线');
 map.invalidateSize();
 if(isCompactAtlas()&&document.querySelector('.side').classList.contains('expanded'))setSheet('half',false);
 const frame=$('map').getBoundingClientRect(),side=document.querySelector('.side').getBoundingClientRect(),toolbar=document.querySelector('.map-toolbar').getBoundingClientRect();
 const bottomSheet=isCompactAtlas();
 const left=bottomSheet?20:Math.min(side.right-frame.left+25,frame.width*.55);
 const top=bottomSheet?Math.max(75,toolbar.bottom-frame.top+18):100;
 const bottom=bottomSheet?Math.min(side.height+20,frame.height*.63):65;
 map.fitBounds(points,{paddingTopLeft:[left,top],paddingBottomRight:[25,bottom],maxZoom:6,animate:false});
}

window.activateTab=activateTab;window.setAtlasYear=setAtlasYear;window.resetAtlasFilters=resetAtlasFilters;window.fitAtlas=fitAtlas;
// Give the existing dynamic tab views a keyboard equivalent to pointer selection.
document.querySelector('.tabs').setAttribute('role','tablist');
document.querySelectorAll('.tab').forEach(t=>{
 t.setAttribute('role','tab');t.tabIndex=0;t.setAttribute('aria-selected',String(t.classList.contains('active')));
 t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click();}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const ts=[...document.querySelectorAll('.tab')];ts[(ts.indexOf(t)+(e.key==='ArrowRight'?1:-1)+ts.length)%ts.length].focus();}});
 t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===t)));$('tabContent').scrollTop=0;});
});

// Accessible names on the original modal close controls and keyboard focus restoration.
let modalReturnFocus=null;
const modalObserver=new MutationObserver(records=>{
 for(const r of records){
  if(r.attributeName==='class'&&(r.target.id==='modalBg'||r.target.id==='formBg')){
   if(r.target.classList.contains('on')){modalReturnFocus=document.activeElement;r.target.setAttribute('role','dialog');r.target.setAttribute('aria-modal','true');r.target.setAttribute('aria-label',r.target.id==='formBg'?'记录飞行':'飞行详情');}
   else if(modalReturnFocus?.isConnected)modalReturnFocus.focus();
  }
 }
 document.querySelectorAll('.modal-close').forEach(el=>{el.setAttribute('role','button');el.setAttribute('aria-label','关闭窗口');el.tabIndex=0;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}};});
});
['modalBg','formBg'].forEach(id=>modalObserver.observe($(id),{attributes:true,attributeFilter:['class'],childList:true,subtree:true}));
// Keep the modal's Tab order inside the active dialog.
document.addEventListener('keydown',e=>{
 if(e.key!=='Tab')return;
 const bg=$('formBg').classList.contains('on')?$('formBg'):$('modalBg').classList.contains('on')?$('modalBg'):null;if(!bg)return;
 const els=[...bg.querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')].filter(x=>x.getClientRects().length&&!x.disabled);
 if(!els.length)return;const first=els[0],last=els[els.length-1];
 if(!bg.contains(document.activeElement)){e.preventDefault();first.focus();}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});

document.querySelectorAll('.menu-item').forEach(el=>{el.tabIndex=0;el.setAttribute('role','button');el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}});el.addEventListener('click',()=>$('headerMenu').classList.remove('on'));});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAtlasSearch();});
// Boot
update();
requestAnimationFrame(fitAtlas);
$('loader').remove();

</script>
